[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-task-orchestrator"
version = "1.0.0"
description = "Zero-Inference Micro-Task Decomposition & Subagent Orchestrator for 7B-9B Models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Architecture Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
mto = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["planner*", "orchestrator*", "subagents*", "validators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
